{% extends "base.html" %}

{% block title %}{{ loja.nome }}{% endblock %}

{% block content %}
<h4 class="mb-3">{{ loja.nome }}</h4>
<p class="text-muted">Digite o seu código do Passaporte EXAGERADO pra pontuar.</p>

<form method="post" action="/loja/{{ loja.codigo_publico }}">
    <div class="mb-3">
        <label class="form-label">Seu código</label>
        <input type="text" class="form-control text-uppercase" name="id_public" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Pontuar</button>
</form>

<p class="text-center text-muted small mt-3">
    Ainda não tem código? <a href="/entrada">Cadastre-se aqui</a>
</p>
{% endblock %}
