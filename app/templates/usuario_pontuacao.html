{% extends "base.html" %}
{% block title %}Consulte Seus Pontos{% endblock %}
{% block content %}
<h4 class="mb-3">Consulte Seus Pontos</h4>
<form method="post" action="/usuario-pontuacao">
    <div class="mb-3">
        <label class="form-label">Digite seu ID</label>
        <input type="text" class="form-control" name="id_public" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Consultar</button>
</form>
{% endblock %}
